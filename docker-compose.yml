services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: catgpt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: catgpt
      POSTGRES_USER: ${POSTGRES_USER:-catgpt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-catgpt123}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-catgpt} -d catgpt"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - catgpt-network

  # Spring Boot Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: catgpt-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Runs the prod profile so Flyway owns the schema and Hibernate validates it
      SPRING_PROFILES_ACTIVE: prod

      # Database Configuration
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/catgpt
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-catgpt}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-catgpt123}

      # JWT Configuration
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}

      # Google OAuth2 Configuration
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}

      # Origins allowed to call the API from a browser
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}

      # External API keys — the backend will not start without a Groq key
      GROQ_API_KEY: ${GROQ_API_KEY}
      THE_CAT_API_KEY: ${THE_CAT_API_KEY:-}
    ports:
      - "8080:8080"
    networks:
      - catgpt-network

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
        VITE_RUN_DURATION_MS: ${VITE_RUN_DURATION_MS:-4000}
        VITE_RUN_MIN_INTERVAL_MS: ${VITE_RUN_MIN_INTERVAL_MS:-120000}
        VITE_RUN_MAX_INTERVAL_MS: ${VITE_RUN_MAX_INTERVAL_MS:-300000}
        VITE_FALL_DURATION_MS: ${VITE_FALL_DURATION_MS:-5000}
        VITE_FALL_MIN_INTERVAL_MS: ${VITE_FALL_MIN_INTERVAL_MS:-10000}
        VITE_FALL_MAX_INTERVAL_MS: ${VITE_FALL_MAX_INTERVAL_MS:-20000}
        VITE_HUNGER_INTERVAL_MS: ${VITE_HUNGER_INTERVAL_MS:-60000}
    container_name: catgpt-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - catgpt-network

volumes:
  postgres-data:
    driver: local

networks:
  catgpt-network:
    driver: bridge
