spring:
  application:
    name: "CatGPT Server"

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      # The schema is owned by Flyway; Hibernate only checks that the entities
      # still match it and fails fast on drift.
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    # Databases created by the earlier ddl-auto:update setting already have the
    # V1 schema, so they are stamped at V1 rather than having it re-applied.
    baseline-on-migrate: true
    baseline-version: 1

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600000}

app:
  frontend-url: ${FRONTEND_URL}
  cors:
    # Defaults to the frontend origin, which is already required here for the
    # OAuth redirect — so a deployment that worked before needs no new variable.
    # Set CORS_ALLOWED_ORIGINS (comma-separated) to allow further origins.
    #
    # This must keep a default: a bare ${CORS_ALLOWED_ORIGINS} makes the property
    # present but unresolvable, which defeats the fallback on the @Value that
    # reads it and fails the whole context at startup.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:${FRONTEND_URL}}

catgpt:
  stats:
    max-hunger: 10
    max-mood: 10
    max-health: 10

groq:
  api-key: ${GROQ_API_KEY}
  model: ${GROQ_MODEL:openai/gpt-oss-120b}

thecatapi:
  api-key: ${THE_CAT_API_KEY:}
